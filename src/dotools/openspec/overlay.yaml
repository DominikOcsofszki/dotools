version: 2
upstreamSchema: spec-driven
schemaName: parallel-task-apply
expectedTaskArtifact:
  id: tasks
  generates: tasks.md
  template: tasks.md
artifactOverrides:
  tasks:
    instruction: |
      Create a dependency-ordered implementation plan grouped into numbered batches.
      Each implementation workstream MUST be a tracked checkbox, not a plain bullet.
      Each checkbox description MUST state the outcome and its verification.
      Add an indented `paths:` line under every checkbox with the exact repository-
      relative files or directories owned by that workstream. Use `paths: none` for
      integration-only checks. Paths within the same batch MUST NOT overlap, including
      parent/child directory overlaps. Add an indented `verify:` line when the
      verification is too detailed for the checkbox description. Add a separate
      tracked integration checkbox in a batch when integration work is needed.
      Put dependencies in batch headings and order batches so prerequisites come first.
      Keep each batch's tests and documentation with the work that calls for them.
    templatePath: tasks.md
    templateContent: |
      # Tasks

      Organize implementation into dependency-ordered batches. Every workstream and
      any required batch integration check is a tracked checkbox. Give each checkbox
      exact, non-overlapping ownership using `paths:` and state its verification.
      The coordinator marks checkboxes only after the workstream is integrated and
      verified. Use `paths: none` for integration-only checks.

      ## 1. <!-- Batch name; prerequisites: none or earlier batch numbers -->

      - [ ] 1.1 <!-- Workstream outcome and verification -->
        - paths: `src/feature.py`, `tests/test_feature.py`
      - [ ] 1.2 <!-- Independent workstream outcome and verification -->
        - paths: `docs/feature.md`
      - [ ] 1.3 <!-- Integration check outcome and verification -->
        - paths: none

      ## 2. <!-- Batch name; prerequisites: batch 1 -->

      - [ ] 2.1 <!-- Workstream outcome and verification -->
        - paths: `src/other.py`
      - [ ] 2.2 <!-- Integration check outcome and verification -->
        - paths: none
applyInstruction: |
  Read the context files and follow the dedicated `openspec-parallel-apply` skill
  for this schema. Process batches in dependency order. Within a batch, validate
  ownership paths and delegate independent workstreams only when separate agents
  can safely work without editing the shared task checklist. The coordinator
  integrates the results, resolves conflicts, runs verification, and then marks
  the relevant workstream checkboxes complete. If delegation is unavailable or
  ownership overlaps, work sequentially. Pause on unclear requirements, blockers,
  conflicts, or design changes.
readme: |-
  # Parallel Task Apply Schema

  This project-local schema is generated from the currently installed OpenSpec `spec-driven` schema with a small local overlay.

  ## Regenerate after an OpenSpec upgrade

  Run this manually after upgrading the OpenSpec CLI:

  ```bash
  dotools openspec generate-schema
  ```

  The generator resolves the installed built-in schema, fingerprints its inputs, applies the local overlay, validates a staged copy, and only then replaces this generated schema. If the fingerprint is unchanged, it exits without rewriting the schema. If upstream task/apply structure conflicts with the overlay or validation fails, it reports the issue and preserves the currently installed schema.

  The generated schema is written to `./openspec/schemas/parallel-task-apply/` relative to the current directory. Use `--dest` to write elsewhere and `--overlay` to supply a different customization overlay. Select it for a change with `--schema parallel-task-apply`.

  Run `dotools openspec generate-schema --check` in CI to fail when the checked-in generated schema differs from the current upstream schema and overlay.

  Task checkboxes represent workstreams and integration checks so OpenSpec progress reflects the actual work. `dotools openspec validate-tasks <tasks.md>` checks that every task declares ownership and that paths do not overlap within a batch. The separately named `/openspec-parallel-apply` skill performs the coordinator workflow; it is not overwritten by `openspec update --force`. Parallel execution remains best-effort and falls back to sequential work when safe delegation is unavailable.
