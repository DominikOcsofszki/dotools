[project]
name = "dotools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dominik Ocsofszki", email = "dominikocsofszki@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.4",
    "mcp-plugin-gateway",
    "pydantic-settings>=2.14.1",
    "pyyaml>=6.0.3",
    "typer>=0.26.7",
]

[project.scripts]
dotools = "dotools.app:main"

[project.entry-points."mcp_plugin_gateway.plugins"]
dotools = "dotools.mcp_plugin:build_server"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
mcp-plugin-gateway = { git = "https://github.com/DominikOcsofszki/mcp-plugin-gateway", rev = "0.0.1" }
